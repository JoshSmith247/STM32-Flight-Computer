[package]
name = "flight-computer"
version = "0.1.0"
edition = "2021"

[dependencies]
# time-driver-tim5: explicit free 32-bit timer (app uses TIM3/TIM4). NOT a fix
# for the still-unresolved executor cadence-clumping (suspects: defmt-RTT
# blocking under probe, UART error-IRQ storm) — proved neutral when tried.
# rev PINNED to the hardware-validated commit; bump deliberately and re-run
# bench bring-up.
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy", rev = "7f8bb6f4ca46e1da4b7cff5a9cc628f5a583a272", features = ["stm32h723zg", "rt", "exti", "defmt", "time-driver-tim5", "unstable-pac"] }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "7f8bb6f4ca46e1da4b7cff5a9cc628f5a583a272", features = ["platform-cortex-m", "executor-thread", "executor-interrupt"] }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "7f8bb6f4ca46e1da4b7cff5a9cc628f5a583a272", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "7f8bb6f4ca46e1da4b7cff5a9cc628f5a583a272", features = ["defmt"] }
embassy-futures = { git = "https://github.com/embassy-rs/embassy", rev = "7f8bb6f4ca46e1da4b7cff5a9cc628f5a583a272" }

libm = "0.2"

critical-section = "1.1"
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"

defmt = "0.3"
defmt-rtt = "0.4"
# NOTE: no panic-probe — main.rs defines its own #[panic_handler] (motor
# emergency-stop + LED off). Linking panic-probe as well would be a duplicate
# panic_handler; it was a dead dependency here.

[profile.release]
debug = true
lto = true
opt-level = 's'

[features]
# This is the nucleo-only branch: every build-time feature flag has been removed
# and the NUCLEO-H723ZG flight configuration baked in. See the branch notes in
# README/NUCLEO_SETUP for what was resolved which way.
default = []
